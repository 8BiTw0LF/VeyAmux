# Builds VeyAmux as a Flatpak.
# - Every push to main / by hand: a test build, kept as a workflow artifact (Actions tab).
# - Pushing a release tag (VeyAmux-V.x.y): the bundle is also attached to that GitHub release as
#   VeyAmux-x86_64.flatpak, which installs with
#     flatpak install --user VeyAmux-x86_64.flatpak
#   (the KDE runtime it needs comes from Flathub automatically).
#   With the secret FLATPAK_GPG_PRIVATE_KEY set, the release is also signed into a Flatpak repository, which
#   flatpak-pages.yml publishes on GitHub Pages (updates through Discover / flatpak update).
name: Flatpak

on:
  push:
    branches: [main]
    tags: ['VeyAmux-V.*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Build this release tag and attach the Flatpak to its release (e.g. VeyAmux-V.1.0); empty: test build of main'
        required: false
        default: ''

permissions:
  contents: write

env:
  SRC: .          # folder with CMakeLists.txt / packaging (linux in the Veyra fork)
  HAVE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY != '' }}

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release || github.ref }}

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder appstream desktop-file-utils elfutils librsvg2-common ostree
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Check the metadata
        working-directory: ${{ env.SRC }}
        run: |
          appstreamcli validate --no-net packaging/flatpak/io.github._8BiTw0LF.VeyAmux.metainfo.xml
          desktop-file-validate packaging/veyamux.desktop

      - uses: actions/cache@v4
        with:
          path: ${{ env.SRC }}/.flatpak-builder
          key: flatpak-builder-${{ hashFiles('**/io.github._8BiTw0LF.VeyAmux.yml') }}

      - name: Build
        working-directory: ${{ env.SRC }}
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo-flatpak --default-branch=stable \
            build-flatpak packaging/flatpak/io.github._8BiTw0LF.VeyAmux.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo-flatpak VeyAmux-x86_64.flatpak io.github._8BiTw0LF.VeyAmux stable

      - uses: actions/upload-artifact@v4
        with:
          name: VeyAmux-x86_64.flatpak
          path: ${{ env.SRC }}/VeyAmux-x86_64.flatpak

      # the AppImage workflow creates the release; wait for it, then add the Flatpak to it
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release != ''
        working-directory: ${{ env.SRC }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          for i in $(seq 1 60); do
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            echo "waiting for the release $TAG ..."; sleep 30
          done
          gh release upload "$TAG" VeyAmux-x86_64.flatpak --clobber -R "$GITHUB_REPOSITORY"

      # the Flatpak repository for GitHub Pages: signed with the project's key, plus the files users add it with
      - name: Flatpak repository
        if: (startsWith(github.ref, 'refs/tags/') || inputs.release != '') && env.HAVE_KEY == 'true'
        working-directory: ${{ env.SRC }}
        env:
          GPG_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          export GNUPGHOME=$(mktemp -d)
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          # debug symbols stay out of the public repository (they are large)
          for ref in $(ostree refs --repo=repo-flatpak | grep '\.Debug/' || true); do ostree refs --repo=repo-flatpak --delete "$ref"; done
          for ref in $(ostree refs --repo=repo-flatpak); do
            case "$ref" in app/*|runtime/*) id=$(echo "$ref" | cut -d/ -f2); branch=$(echo "$ref" | cut -d/ -f4)
              flatpak build-sign repo-flatpak "$id" "$branch" --gpg-sign="$KEYID" --gpg-homedir="$GNUPGHOME" $( [ "${ref%%/*}" = runtime ] && echo --runtime ) ;;
            esac
          done
          flatpak build-update-repo --gpg-sign="$KEYID" --gpg-homedir="$GNUPGHOME" --generate-static-deltas --prune repo-flatpak
          KEY=$(gpg --export "$KEYID" | base64 -w0)
          BASE="https://$(echo "$OWNER" | tr 'A-Z' 'a-z').github.io/$REPO"
          mkdir -p site && cp -a repo-flatpak site/repo && cp packaging/veyamux.svg site/icon.svg
          printf '%s\n' '[Flatpak Repo]' 'Title=VeyAmux' "Url=$BASE/repo/" "Homepage=https://github.com/$OWNER/$REPO" \
            'Comment=VeyAmux, the capture-card viewer with GPU upscaling' "Icon=$BASE/icon.svg" "GPGKey=$KEY" > site/veyamux.flatpakrepo
          printf '%s\n' '[Flatpak Ref]' 'Name=io.github._8BiTw0LF.VeyAmux' 'Branch=stable' 'Title=VeyAmux' "Url=$BASE/repo/" \
            'SuggestRemoteName=veyamux' 'RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo' 'IsRuntime=false' "GPGKey=$KEY" > site/veyamux.flatpakref
          # (a release made before this page existed: take it from main)
          [ -f packaging/flatpak/pages-index.html ] || curl -sSfL "https://raw.githubusercontent.com/$OWNER/$REPO/main/packaging/flatpak/pages-index.html" -o packaging/flatpak/pages-index.html
          sed -e "s|@BASE@|$BASE|g" -e "s|@REPO@|https://github.com/$OWNER/$REPO|g" packaging/flatpak/pages-index.html > site/index.html
          touch site/.nojekyll

      - uses: actions/upload-artifact@v4
        if: (startsWith(github.ref, 'refs/tags/') || inputs.release != '') && env.HAVE_KEY == 'true'
        with:
          name: flatpak-site
          path: ${{ env.SRC }}/site
          include-hidden-files: true
