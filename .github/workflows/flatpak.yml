# Builds VeyAmux as a Flatpak.
# - Every push to main / by hand: a test build, kept as a workflow artifact (Actions tab).
# - Pushing a release tag (VeyAmux-V.x.y): the bundle is also attached to that GitHub release as
#   VeyAmux-x86_64.flatpak, which installs with
#     flatpak install --user VeyAmux-x86_64.flatpak
#   (the KDE runtime it needs comes from Flathub automatically).
name: Flatpak

on:
  push:
    branches: [main]
    tags: ['VeyAmux-V.*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Build this release tag and attach the Flatpak to its release (e.g. VeyAmux-V.1.0); empty: test build of main'
        required: false
        default: ''

permissions:
  contents: write

env:
  SRC: .          # folder with CMakeLists.txt / packaging (linux in the Veyra fork)

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release || github.ref }}

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder appstream desktop-file-utils elfutils librsvg2-common
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Check the metadata
        working-directory: ${{ env.SRC }}
        run: |
          appstreamcli validate --no-net packaging/flatpak/io.github._8BiTw0LF.VeyAmux.metainfo.xml
          desktop-file-validate packaging/veyamux.desktop

      - uses: actions/cache@v4
        with:
          path: ${{ env.SRC }}/.flatpak-builder
          key: flatpak-builder-${{ hashFiles('**/io.github._8BiTw0LF.VeyAmux.yml') }}

      - name: Build
        working-directory: ${{ env.SRC }}
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo-flatpak \
            build-flatpak packaging/flatpak/io.github._8BiTw0LF.VeyAmux.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo-flatpak VeyAmux-x86_64.flatpak io.github._8BiTw0LF.VeyAmux

      - uses: actions/upload-artifact@v4
        with:
          name: VeyAmux-x86_64.flatpak
          path: ${{ env.SRC }}/VeyAmux-x86_64.flatpak

      # the AppImage workflow creates the release; wait for it, then add the Flatpak to it
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release != ''
        working-directory: ${{ env.SRC }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          for i in $(seq 1 60); do
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            echo "waiting for the release $TAG ..."; sleep 30
          done
          gh release upload "$TAG" VeyAmux-x86_64.flatpak --clobber -R "$GITHUB_REPOSITORY"
